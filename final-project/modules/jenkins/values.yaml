controller:
  containerEnv:
    - name: CI_TOOLS_IMAGE
      value: "${ci_tools_image}"
    - name: KANIKO_IMAGE
      value: "${kaniko_image}"
    - name: KANIKO_CONFIG_MAP
      value: "${kaniko_config_map}"
    - name: GITOPS_TOKEN
      valueFrom:
        secretKeyRef:
          name: jenkins-gitops-token
          key: token
  serviceType: ClusterIP
  numExecutors: 0
  resources:
    requests:
      cpu: "200m"
      memory: "768Mi"
