  JCasC:
    defaultConfig: true
    configScripts:
      gitops-credentials: |
        credentials:
          system:
            domainCredentials:
              - credentials:
                  - string:
                      scope: GLOBAL
                      id: github-gitops-pat
                      description: GitOps push token from Kubernetes Secret
                      secret: "$${GITOPS_TOKEN}"
      seed-job: |
        jobs:
          - script: >
              pipelineJob('django-ecr-gitops') {
                description('Build Django with Kaniko, push to ECR, update GitOps main')
                parameters { booleanParam('DEPLOY', false, 'GitOps/deployment requires separate rollout authorization'); booleanParam('PUBLISH_GITOPS', false, 'Publish reviewed GitOps artifact only, without cluster sync') }
                definition {
                  cpsScm {
                    scm {
                      git {
                        remote { url('${source_repo}') }
                        branches('*/${source_branch}')
                      }
                    }
                    scriptPath('final-project/Jenkinsfile')
                    lightweight(true)
                  }
                }
              }
agent:
  enabled: true
persistence:
  enabled: ${persistence_enabled}
  storageClass: gp3
  size: 8Gi
  existingClaim: "${existing_claim}"
  subPath: "${existing_claim_sub_path}"
