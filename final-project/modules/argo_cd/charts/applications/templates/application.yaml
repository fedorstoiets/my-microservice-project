apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django-gitops
  namespace: {{ .Release.Namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: {{ .Values.repoURL | quote }}
    targetRevision: {{ .Values.targetRevision | quote }}
    path: charts/django-app
    helm:
      releaseName: django-app
      valuesObject:
        {{- toYaml .Values.appValues | nindent 8 }}
      parameters:
        - name: config.POSTGRES_HOST
          value: {{ required "rdsEndpoint required" .Values.rdsEndpoint | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.appNamespace | quote }}
  syncPolicy:
    {{- if .Values.enableAutoSync }}
    automated:
      enabled: true
      prune: {{ .Values.enablePruning }}
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
