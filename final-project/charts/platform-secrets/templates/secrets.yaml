apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jenkins-gitops-token
  namespace: jenkins
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target: { name: jenkins-gitops-token, creationPolicy: Owner }
  data:
    - secretKey: token
      remoteRef:
        key: {{ required "gitopsSecretArn required" .Values.gitopsSecretArn | quote }}
        property: push_token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-gitops-repository
  namespace: argocd
spec:
  refreshInterval: 5m
  secretStoreRef: { kind: ClusterSecretStore, name: aws-secrets-manager }
  target:
    name: argocd-gitops-repository
    creationPolicy: Owner
    template:
      metadata:
        labels: { argocd.argoproj.io/secret-type: repository }
      data:
        type: git
        url: {{ required "gitopsRepo required" .Values.gitopsRepo | quote }}
        username: x-access-token
        password: "{{ `{{ .read_token }}` }}"
  data:
    - secretKey: read_token
      remoteRef:
        key: {{ .Values.gitopsSecretArn | quote }}
        property: read_token
