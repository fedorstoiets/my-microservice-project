{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  name: django-rds-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: {{ required "externalSecrets.rdsSecretArn required" .Values.externalSecrets.rdsSecretArn | quote }}
        property: username
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecrets.rdsSecretArn | quote }}
        property: password
    - secretKey: DJANGO_SECRET_KEY
      remoteRef:
        key: {{ required "externalSecrets.djangoSecretArn required" .Values.externalSecrets.djangoSecretArn | quote }}
        property: secret_key
{{- end }}
