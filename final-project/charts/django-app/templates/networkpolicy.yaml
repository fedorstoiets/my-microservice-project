{{- if .Values.networkPolicy.enabled }}
{{- $_ := required "networkPolicy.databaseCidrs required for private RDS egress" .Values.networkPolicy.databaseCidrs }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: {{ .Release.Namespace }}
  name: {{ include "django-app.fullname" . }}
spec:
  podSelector:
    matchLabels:
      app: {{ include "django-app.fullname" . }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 8000 }]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to:
        {{- range .Values.networkPolicy.databaseCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}
