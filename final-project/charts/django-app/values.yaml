nameOverride: ''
fullnameOverride: ''
image:
  repository: 227281812993.dkr.ecr.us-east-2.amazonaws.com/lesson-7-django
  tag: bootstrap-required
  pullPolicy: IfNotPresent
  digest: ''
replicaCount: 2
service:
  type: ClusterIP
  port: 80
  targetPort: 8000
config:
  DJANGO_DEBUG: '0'
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,django-app,django-app.neoversity.svc.cluster.local
  POSTGRES_DB: neoversity_db
  POSTGRES_HOST: ''
  POSTGRES_PORT: '5432'
  POSTGRES_SSLMODE: verify-full
  POSTGRES_SSLROOTCERT: /app/certs/rds-global-bundle.pem
secretName: django-rds-secrets
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
postgresql:
  enabled: false
ingress:
  enabled: false
  className: nginx
  host: example.com
  path: /
  pathType: Prefix
  tls: false
  tlsSecretName: django-app-tls
  clusterIssuer: letsencrypt-prod
migrations:
  enabled: true
externalSecrets:
  enabled: false
  rdsSecretArn: ''
  djangoSecretArn: ''
  storeName: aws-secrets-manager
networkPolicy:
  enabled: false
  databaseCidrs: []
  ingressNamespaces:
  - jenkins
  - monitoring
  - ingress-nginx
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
    - ALL
databaseBootstrap:
  enabled: false
  adminSecretArn: ''
